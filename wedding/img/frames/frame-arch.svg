<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400">
  <!--
    Garden-arch frame, used as an absolutely positioned overlay on a figure
    locked to `aspect-ratio: 3 / 4`. The photo beneath is inset 4% / 3% and
    given a matching arch via border-radius, so the two line up at any size.
    Both arcs are centred on y=150, which is what keeps them concentric; the
    photo opening is the 276x376 box inset 12 units on every side.
  -->
  <defs>
    <path id="leaf" d="M0 0C6.5-10.5 21-13.5 30-4 21 5.5 6.5 8.5 0 0Z"/>

    <g id="floret">
      <g fill="#6E8CA1">
        <ellipse cx="0" cy="-4.6" rx="2.6" ry="4.4"/>
        <ellipse cx="4.6" cy="0" rx="4.4" ry="2.6"/>
        <ellipse cx="0" cy="4.6" rx="2.6" ry="4.4"/>
        <ellipse cx="-4.6" cy="0" rx="4.4" ry="2.6"/>
      </g>
      <circle r="1.9" fill="#C7A96B"/>
    </g>

    <!-- Leaves stepping along a stem, growing from the origin toward +x. -->
    <g id="spray">
      <path d="M0 0C16-4 36-5 56-2" fill="none" stroke="#4E6E54" stroke-width="1.4"/>
      <use href="#leaf" transform="translate(4,-1) rotate(-48) scale(1)" fill="#2C4436"/>
      <use href="#leaf" transform="translate(10,1) rotate(42) scale(0.84)" fill="#7C9A78"/>
      <use href="#leaf" transform="translate(22,-3) rotate(-30) scale(1.2)" fill="#3E5C4B"/>
      <use href="#leaf" transform="translate(29,-1) rotate(26) scale(0.96)" fill="#5F7F63"/>
      <use href="#leaf" transform="translate(41,-4) rotate(-14) scale(1.1)" fill="#4E6E54"/>
      <use href="#leaf" transform="translate(53,-2) rotate(8) scale(0.82)" fill="#93AC8B"/>
      <g fill="#9C5348">
        <circle cx="16" cy="4" r="3.2"/>
        <circle cx="24" cy="8" r="2.3"/>
        <circle cx="35" cy="5" r="2" fill="#8B4438"/>
      </g>
    </g>
  </defs>

  <!-- Outer band and inner rule, concentric about (150,150), plus a plinth. -->
  <path d="M6 394V150a144 144 0 0 1 288 0v244" fill="none" stroke="#46644F" stroke-width="3.5"/>
  <path d="M12 388V150a138 138 0 0 1 276 0v238" fill="none" stroke="#9C5348" stroke-width="1.6"/>
  <path d="M2 396h296" fill="none" stroke="#46644F" stroke-width="3"/>

  <!-- Foliage climbing the flanks: each spray is rooted on the band and angled
       along the tangent, so it drapes across the rule rather than sitting on it. -->
  <use href="#spray" transform="translate(18,104) rotate(-70)"/>
  <use href="#floret" transform="translate(32,60) scale(0.95)"/>
  <use href="#spray" transform="translate(281,344) rotate(-96)"/>
  <use href="#floret" transform="translate(273,282) scale(0.9)"/>
  <use href="#spray" transform="translate(20,372) rotate(-84) scale(0.72)"/>
  <use href="#spray" transform="translate(252,62) rotate(52) scale(0.66)"/>
</svg>
