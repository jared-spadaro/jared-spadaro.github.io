name: Build blog index

on:
  push:
    branches: [main]
    paths:
      - "blog/posts/**"
      - "scripts/build-blog-index.mjs"
      - ".github/workflows/blog-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate blog/posts.json
        run: node scripts/build-blog-index.mjs

      - name: Commit the index if it changed
        run: |
          if git diff --quiet -- blog/posts.json; then
            echo "Index already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/posts.json
          git commit -m "chore(blog): rebuild post index"
          git push
