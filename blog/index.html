<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Blog &middot; Antisocialistic</title>
    <meta name="description" content="Writing by Jared Spadaro, aka Antisocialistic." />

    <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png" />

    <link href="../bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/blog.css" rel="stylesheet" />
  </head>

  <body class="blog">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
      <a class="navbar-brand" href="../">Home</a>
      <ul class="navbar-nav mr-auto">
        <li class="nav-item active"><a class="nav-link" href="./">Blog</a></li>
      </ul>
    </nav>

    <main class="blog-wrap">
      <header class="blog-masthead">
        <h1>Blog</h1>
        <p>Notes, projects, and whatever else is on my mind.</p>
      </header>

      <div id="posts" class="blog-empty">Loading posts&hellip;</div>
    </main>

    <script>
      (function () {
        var mount = document.getElementById("posts");

        function formatDate(iso) {
          // Parse as a plain calendar date so the timezone can't shift the day.
          var parts = String(iso).slice(0, 10).split("-");
          var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
          if (isNaN(d)) return iso;
          return d.toLocaleDateString(undefined, {
            year: "numeric",
            month: "long",
            day: "numeric",
          });
        }

        function el(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text != null) node.textContent = text;
          return node;
        }

        function render(posts) {
          if (!posts.length) {
            mount.className = "blog-empty";
            mount.textContent = "No posts yet. Check back soon.";
            return;
          }

          var list = el("ul", "post-list");

          posts.forEach(function (post) {
            var item = el("li");

            var heading = el("h2");
            var link = el("a", null, post.title);
            link.href = "post.html?slug=" + encodeURIComponent(post.slug);
            heading.appendChild(link);
            item.appendChild(heading);

            item.appendChild(el("div", "post-meta", formatDate(post.date)));

            if (post.summary) {
              item.appendChild(el("p", "post-summary", post.summary));
            }

            (post.tags || []).forEach(function (tag) {
              item.appendChild(el("span", "tag", tag));
            });

            list.appendChild(item);
          });

          mount.className = "";
          mount.innerHTML = "";
          mount.appendChild(list);
        }

        fetch("posts.json", { cache: "no-cache" })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(function (data) {
            render(Array.isArray(data) ? data : data.posts || []);
          })
          .catch(function (err) {
            mount.className = "blog-error";
            mount.textContent = "Could not load the post index. (" + err.message + ")";
          });
      })();
    </script>
  </body>
</html>
